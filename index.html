<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Season Tracker</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/chart.umd.js"></script>
</head>
<body>
<header class="topbar">
  <h1>🏉 Pre-Season Tracker</h1>
  <nav class="tabs">
    <button class="tab-btn" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="program">Program</button>
    <button class="tab-btn" data-tab="log">Log</button>
    <button class="tab-btn" data-tab="history">History</button>
    <button class="tab-btn" data-tab="progress">Progress</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
  </nav>
</header>

<main>
  <section id="panel-dashboard" class="tab-panel"></section>
  <section id="panel-program" class="tab-panel"></section>
  <section id="panel-log" class="tab-panel"></section>
  <section id="panel-history" class="tab-panel"></section>
  <section id="panel-progress" class="tab-panel"></section>
  <section id="panel-settings" class="tab-panel"></section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
